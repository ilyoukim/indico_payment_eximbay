[metadata]
name = indico-plugin-payment-eximbay
version = 3.0
description = Eximbay payments for Indico event registration fees
long_description = file: README.md
long_description_content_type = text/markdown; charset=UTF-8; variant=GFM
url = https://github.com/indico/indico-plugins
license = MIT
author = GyuJin Kim (PAL)
author_email = ilyoukim@postech.ac.kr
classifiers =
    Environment :: Plugins
    Environment :: Web Environment
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.9

[options]
packages = find:
zip_safe = false
include_package_data = true
python_requires = >=3.9.0, <3.11
install_requires =
    indico>=3.2
    iso4217==1.6.20180829

[options.entry_points]
indico.plugins =
    payment_eximbay = indico_payment_eximbay.plugin:eximbayPaymentPlugin

